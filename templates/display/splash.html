<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Splash</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        * { cursor: none !important; }
        #logo { position: absolute; left: 0; top: 0; white-space: nowrap; font: 800 18vh/1 "Segoe UI", sans-serif; letter-spacing: .05em; will-change: transform; }
            #logo.img { background: currentColor; -webkit-mask: url(/static/osc-logo.png) center / contain no-repeat; mask: url(/static/osc-logo.png) center / contain no-repeat; }
    </style>
</head>
<body>
    <div id="logo"></div>
    <script>
        // ?text=Radxa            text instead of the OSC logo
        // ?cols=8&col=3          this screen is column 3 (0-based) of an 8-wide wall; every screen
        // ?rows=1&row=0          derives the position from the wall clock, so the logo bounces
        //                        across the whole wall in sync. Defaults: a single screen.
        const q = new URLSearchParams(location.search);
        const num = (k, d) => Number(q.get(k) ?? d) || d;
        const W = {{ wall | tojson }}; // set when ?device=&display= match a tile of the saved wall layout
        const cols = W ? W.cols : num("cols", 1), col = W ? W.col : num("col", 0), rows = W ? W.rows : num("rows", 1), row = W ? W.row : num("row", 0);
        const rw = W ? W.cw : 1, rh = W ? W.rh : 1; // grid cells this window covers
        // Everything below is in wall units (1 = one screen cell), NOT pixels. The position comes from the absolute wall
        // clock, so a 1px (or 1080p vs 1200p) difference in a PC's track length would put it at a completely different
        // point of the path. With a fixed logo size and speed in cells, every PC computes exactly the same path.
        const SPEED = num("speed", 100) / 100; // ?speed=150 = 1.5x
        const SPEED_X = SPEED * num("vx", 220) / 1920, SPEED_Y = SPEED * num("vy", 140) / 1200; // cells/s (vx/vy given as px/s on a 1920x1200 screen)
        const LOGO_W = 0.18, LOGO_H = 0.22; // logo box in cells: fraction of a screen's width / height
        const COLORS = ["#ff3b30", "#ff9500", "#ffd60a", "#34c759", "#5ac8fa", "#0a84ff", "#bf5af2", "#ff2d55"];
        const logo = document.getElementById("logo");
        const isText = !!q.get("text");
        const TEXT_W = isText ? q.get("text").length * 0.62 * 0.18 * (1200 / 1920) : 0; // chars * em-width * font size, in cells (nominal 1920x1200 screen)
        if (isText) logo.textContent = q.get("text"); else logo.className = "img"; // default: OSC logo

        // Bounce with a bit of randomness: every pass across the track has its own speed (0.6x-1.4x), taken from a
        // fixed seeded sequence so all PCs agree. 64 passes (even, so it ends where it began) = one repeating cycle.
        const SEGS = 64;
        const rng = (seed) => () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
        const mults = (seed) => { const r = rng(seed); return Array.from({ length: SEGS }, () => 0.6 + 0.8 * r()); };
        const MX = mults(1), MY = mults(2);
        // time t (s) along a track of length L at base speed v -> [position, bounce count]
        function bounce(t, L, v, M) {
            const dur = M.map((m) => L / (v * m)), cycle = dur.reduce((a, b) => a + b, 0);
            let r = t % cycle, i = 0;
            while (r >= dur[i]) r -= dur[i++];
            const f = r / dur[i];
            return [i % 2 ? L * (1 - f) : L * f, Math.floor(t / cycle) * SEGS + i];
        }

        function frame() {
            const sw = innerWidth / rw, sh = innerHeight / rh; // size of one grid cell in px
            if (isText) logo.style.fontSize = (0.18 * sh) + "px";
            else { logo.style.width = (LOGO_W * sw) + "px"; logo.style.height = (LOGO_H * sh) + "px"; }
            const lw = isText ? TEXT_W : LOGO_W, lh = isText ? 0.18 : LOGO_H; // text size is an estimate, not measured: fonts differ per PC
            const t = Date.now() / 1000;
            const [x, bx] = bounce(t, Math.max(0.01, cols - lw), SPEED_X, MX);
            const [y, by] = bounce(t, Math.max(0.01, rows - lh), SPEED_Y, MY);
            logo.style.transform = `translate(${(x - col) * sw}px, ${(y - row) * sh}px)`;
            logo.style.color = COLORS[(bx + by) % COLORS.length];
            requestAnimationFrame(frame);
        }
        frame();
    </script>
</body>
</html>
